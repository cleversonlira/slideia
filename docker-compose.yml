# Local simulation of the production stack:
#   app (remote server) + Postgres + SeaweedFS (S3 API) + Mailpit (inbox at http://localhost:8025)
#   docker compose up --build    ->   http://localhost:8787
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: apresenta
      POSTGRES_DB: apresenta
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  # S3-compatible storage (SeaweedFS), with the same credentials model as production S3.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    volumes: [blobs:/data]

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["8025:8025"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
      mailpit: { condition: service_started }
    ports: ["8787:8787"]
    environment:
      APRESENTA_DEV: "1"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      DATABASE_URL: postgres://postgres:apresenta@db:5432/apresenta
      BLOB_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: apresenta
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: apresenta
      S3_SECRET_ACCESS_KEY: apresenta-secret
      S3_FORCE_PATH_STYLE: "1"
      S3_CREATE_BUCKET: "1"
      MAIL_DRIVER: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Apresenta <nao-responda@apresenta.local>"
      DEMO_EMAIL: demo@apresenta.local
      DEMO_PASSWORD: demo-apresenta-2026
      METRICS_TOKEN: metrics-local
      OPENAI_APPS_CHALLENGE_TOKEN: ${OPENAI_APPS_CHALLENGE_TOKEN:-}
      TRUST_PROXY: "1"
    volumes: [data:/data]

configs:
  s3_identities:
    content: |
      {"identities":[{"name":"apresenta","credentials":[{"accessKey":"apresenta","secretKey":"apresenta-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  db:
  blobs:
  data:
