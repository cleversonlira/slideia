# nginx site for slideia.site (copied to /etc/nginx/sites-available/slideia.site).
# certbot --nginx adds the TLS server blocks and the http→https redirect.

server {
    listen 80;
    server_name slideia.site www.slideia.site;

    # Editor uploads images up to 12 MB and saves decks up to 20 MB (express limits).
    client_max_body_size 25m;

    location / {
        if ($host = www.slideia.site) {
            return 301 https://slideia.site$request_uri;
        }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (live updates in the editor) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
